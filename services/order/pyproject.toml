[project]
name = "farm-order"
version = "0.1.0"
description = "Cart, checkout saga, V1 and V2 orders, mock payments"
requires-python = ">=3.12"
dependencies = [
    "farm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "tzdata>=2026.6",
]

[tool.uv.sources]
farm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]
