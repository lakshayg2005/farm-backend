[project]
name = "farm-media"
version = "0.1.0"
description = "Signed photo uploads, EXIF/GPS verification, thumbnails"
requires-python = ">=3.12"
dependencies = [
    "farm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "boto3>=1.35",
    "pillow>=11.0",
    "httpx>=0.27",
    "arq>=0.26",
    "exifread>=3.0",
]

[tool.uv.sources]
farm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_service"]
