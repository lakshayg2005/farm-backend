[project]
name = "farm-identity"
version = "0.1.0"
description = "Users, roles, phone OTP, JWT issue and refresh, farmer verification"
requires-python = ">=3.12"
dependencies = [
    "farm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "bcrypt>=4.2",
    "pyjwt[crypto]>=2.9",
    "email-validator>=2.2",
]

[tool.uv.sources]
farm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
