# Staging Compose deployment for a single 4 GB RAM VM
# Images are pulled from GitHub Container Registry (GHCR).
# External traffic enters through Traefik with automated Let's Encrypt HTTPS on 80/443.
# Memory limits are configured on every container to safely stay within 4 GB host RAM bounds.

x-service: &service
  restart: unless-stopped
  volumes:
    - ./secrets:/run/secrets:ro
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging: &logging
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        memory: 256M
      reservations:
        memory: 128M

x-env: &env
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
  ENVIRONMENT: staging
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # community MinIO build; minio/minio is no longer on Docker Hub
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} && mc anonymous set download local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-farm-media}

  gateway:
    image: traefik:v3.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./infra/traefik/traefik.staging.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.staging.yml:/etc/traefik/dynamic.yml:ro
      - traefik_acme:/etc/traefik/acme
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@farm-direct.staging}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  identity:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/identity:${IMAGE_TAG:-latest}
    command: sh -c "cd services/identity && alembic upgrade head && cd /app && uvicorn identity_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_identity:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/identity
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}

  catalog:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/catalog:${IMAGE_TAG:-latest}
    command: sh -c "cd services/catalog && alembic upgrade head && cd /app && uvicorn catalog_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_catalog:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/catalog

  land:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/land:${IMAGE_TAG:-latest}
    command: sh -c "cd services/land && alembic upgrade head && cd /app && uvicorn land_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_land:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/land

  media:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/media:${IMAGE_TAG:-latest}
    command: sh -c "cd services/media && alembic upgrade head && cd /app && uvicorn media_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_media:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/media
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://${STAGING_DOMAIN:-localhost}}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-farm-media}
      CATALOG_INTERNAL_URL: http://catalog:8000
      LAND_INTERNAL_URL: http://land:8000

  media-worker:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/media:${IMAGE_TAG:-latest}
    command: arq media_service.worker.WorkerSettings
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_media:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://${STAGING_DOMAIN:-localhost}}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-farm-media}
    depends_on:
      media: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  quality:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/quality:${IMAGE_TAG:-latest}
    command: sh -c "cd services/quality && alembic upgrade head && cd /app && uvicorn quality_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_quality:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/quality

  order:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/order:${IMAGE_TAG:-latest}
    command: sh -c "cd services/order && alembic upgrade head && cd /app && uvicorn order_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_order:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/order
      CATALOG_URL: http://catalog:8000

  logistics:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/logistics:${IMAGE_TAG:-latest}
    command: sh -c "cd services/logistics && alembic upgrade head && cd /app && uvicorn logistics_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_logistics:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/logistics

  notification:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/lakshayg2005/farm-backend}/notification:${IMAGE_TAG:-latest}
    command: sh -c "cd services/notification && alembic upgrade head && cd /app && uvicorn notification_service.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *env
      DATABASE_URL: postgresql+asyncpg://farm_notification:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ROOT_PATH: /api/v1/notification
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}

volumes:
  pgdata:
  miniodata:
  traefik_acme:
