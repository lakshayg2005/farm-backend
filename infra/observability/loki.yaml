# Loki, single binary, files on disk. Logs arrive over OTLP from the collector (/otlp).
# Started with -config.expand-env=true; LOKI_DATA is the data directory.
auth_enabled: false

server:
  http_listen_address: ${LOKI_LISTEN:-0.0.0.0}
  http_listen_port: 3100
  grpc_listen_address: ${LOKI_LISTEN:-0.0.0.0}
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: ${LOKI_LISTEN:-127.0.0.1}
  path_prefix: ${LOKI_DATA:-/loki}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA:-/loki}/chunks
      rules_directory: ${LOKI_DATA:-/loki}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 336h          # 14 days
  ingestion_rate_mb: 32           # load tests log every request
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 16MB
  per_stream_rate_limit_burst: 32MB

compactor:
  working_directory: ${LOKI_DATA:-/loki}/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
