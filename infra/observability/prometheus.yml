# Prometheus: scrapes the collector (service metrics) and the infrastructure exporters.
# Started with --web.enable-remote-write-receiver: k6 and Tempo's metrics-generator push into it.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: services          # farm services, via the OpenTelemetry Collector
    honor_labels: true
    static_configs: [{targets: ["otel-collector:8889"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: gateway           # Traefik
    static_configs: [{targets: ["gateway:8082"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: rabbitmq          # rabbitmq_prometheus plugin, one series per queue
    metrics_path: /metrics/per-object
    static_configs: [{targets: ["rabbitmq:15692"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: prometheus
    static_configs: [{targets: ["prometheus:9090"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
