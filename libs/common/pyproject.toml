[project]
name = "farm-common"
version = "0.1.0"
description = "Shared code for all Farm Platform services"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "fastapi>=0.115",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-system-metrics>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farm_common"]
