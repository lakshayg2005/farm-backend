# uv workspace root (virtual: not a package itself).
# `uv sync --all-packages` installs libs/common and every service into one .venv for local dev.

[tool.uv.workspace]
members = ["libs/common", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# line length is enforced by `ruff format`; long docstrings/comments are fine
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults by design
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "farm_common.auth.require_roles",
]

[tool.ruff.lint.isort]
known-first-party = ["farm_common", "*_service"]

[tool.pytest.ini_options]
# importlib mode: every service has its own tests/ folder with the same file names
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["libs/common/tests", "services"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
