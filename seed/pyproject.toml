[project]
name = "farm-seed"
version = "0.1.0"
description = "Dummy data simulator: fills the platform through the gateway API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pillow>=11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farm_seed"]
